              <!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>FptContact Email</title>
</head>

<body class=""
    style="background-color: #E5E5E5; font-family: sans-serif; -webkit-font-smoothing: antialiased; font-size: 12px; line-height: 1.4; margin: 0; padding: 0; -ms-text-size-adjust: 100%; -webkit-text-size-adjust: 100%;">
    <table border="0" cellpadding="0" cellspacing="0" class="body"
        style="border-collapse: separate; mso-table-lspace: 0pt; mso-table-rspace: 0pt; width: 100%; padding: 0; background-color: #ffffff;">
        <tbody>
            <tr>
                <td style="font-family: sans-serif; font-size: 12px; vertical-align: top;">&nbsp;</td>
                <td class="container"
                    style="font-family: sans-serif; font-size: 12px; vertical-align: top; display: block; margin: 0 auto; max-width: 800px; padding: 0; width: 800px;">
                    <div class="content"
                        style="box-sizing: border-box; display: block; Margin: 0; max-width: 800px; padding: 0;">

                        <!-- START CENTERED WHITE CONTAINER -->
                        <div style="background: #fff; text-align: center; width: 100%;">
                           <img src="https://raw.githubusercontent.com/buiduyanh0/image-econtract/main/Group_1_GHN_replaced.png" alt="Group-1" border="0" style="width: 89%">
                        </div>
                        <table class="main"
                            style="border-collapse: separate; mso-table-lspace: 0pt; mso-table-rspace: 0pt; width: 100%; background: #ffffff; border-radius: 3px;">

                            <!-- START MAIN CONTENT AREA -->
                            <tr>
                                <td class="wrapper"
                                    style="font-family: sans-serif; font-size: 12px; vertical-align: top; box-sizing: border-box; padding: 0 5%;">
                                    <table border="0" cellpadding="0" cellspacing="0"
                                        style="border-collapse: separate; mso-table-lspace: 0pt; mso-table-rspace: 0pt; width: 100%;">
                                        <tr>
                                            <td style="font-family: sans-serif; font-size: 12px; vertical-align: top;">
                                                <h1 style=" font-weight: bold; font-size: 18px; line-height: 24px;
                              margin-bottom: 10px; margin-top: 0; " th:with="rcpNameMail=(@{|Chào Anh/Chị ${rcpName}|})"
                                                    th:text="${rcpNameMail}">Chào Anh/Chị Nguyễn Văn A,</h1>
                                                <div
                                                    style="background: rgba(233, 234, 247, 0.5); margin-bottom: 16px; text-align: left; padding: 20px">
                                                    <div>Anh/Chị có Hợp Đồng/ Phụ Lục Hợp Đồng <span th:text="${envNo}">${envNo}</span> được gửi từ <span th:text="${orgName}">Tên công ty</span> <b>ĐÃ QUÁ HẠN</b></div>

                                                    <p style="font-size: 13px; font-weight: 600;"
                                                        th:with="envID=(@{|ID hợp đồng: ${envId}|})" th:text="${envID}">
                                                        ID hợp đồng: 123456
                                                    </p>

                                                    <div>
                                                        <p style="
                                                font-weight: 500;
                                                margin-top: 0;
                                                margin-bottom: 4px;
                                                font-size: 13px;
                                                line-height: 18px;
                                            " >Anh/ chị vui lòng liên hệ lại Khối Nhân Lực để gia hạn ký Hợp Đồng/ Phụ Lục Hợp Đồng. </p>
                                                    </div>
                                                    <p style="font-weight: 500; margin-top: 0; margin-bottom: 10px; font-size: 14px;
                                  line-height: 18px;">Trân trọng cảm ơn Anh/Chị</p>
                                                    <span style="font-weight: 500; margin-top: 0; margin-bottom: 4px; font-size: 14px;
                                  line-height: 18px;" th:text="${orgName}">Tên công ty</span>
                                                </div>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                            <!-- END MAIN CONTENT AREA -->
                        </table>

                        <!-- END CENTERED WHITE CONTAINER -->
                    </div>
                </td>
                <td style="font-family: sans-serif; font-size: 12px; vertical-align: top;">&nbsp;</td>
            </tr>
    </table>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>FptContact Email</title>
</head>

<body class="" style="background-color: #E5E5E5;font-family: sans-serif;-webkit-font-smoothing: antialiased;font-size: 12px;line-height: 1.4;margin: 0;padding: 0;-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;">
<table border="0" cellpadding="0" cellspacing="0" class="body" style="border-collapse: separate;mso-table-lspace: 0pt;mso-table-rspace: 0pt;width: 100%;padding: 0;background-color: #ffffff;">
  <tbody>
  <tr>
    <td style="font-family: sans-serif; font-size: 12px; vertical-align: top;">&nbsp;</td>
    <td class="container" style="font-family: sans-serif;font-size: 12px;vertical-align: top;display: block;margin: 0 auto;max-width: 800px;padding: 0;width: 800px;">
      <div class="content" style="box-sizing: border-box;display: block;Margin: 0;max-width: 800px;padding: 0;">

        <!-- START CENTERED WHITE CONTAINER -->
        <div class="header"
             style="clear: both;text-align: center;width: 100%;background: white; justify-content: center !important;">
          <img src="https://i.imgur.com/BMuQzNg.png" alt="VITADAIRY"
               style="max-width: 100%;height: auto;min-height: 32px;">
        </div>
        <table class="main" style="border-collapse: separate; mso-table-lspace: 0pt; mso-table-rspace: 0pt; width: 100%; background: #ffffff; border-radius: 3px;">

          <!-- START MAIN CONTENT AREA -->
          <tr>
            <td class="wrapper" style="font-family: sans-serif; font-size: 12px; vertical-align: top; box-sizing: border-box; padding: 5%;padding-bottom: 0;">
              <table border="0" cellpadding="0" cellspacing="0" style="border-collapse: separate; mso-table-lspace: 0pt; mso-table-rspace: 0pt; width: 100%;">
                <tr>
                  <td style="font-family: sans-serif; font-size: 12px; vertical-align: top;">
                    <h1 style="
                                                font-weight: bold;
                                                font-size: 18px;
                                                line-height: 24px;
                                                color: #2E6CF6;
                                                margin-bottom: 24px;
                                                margin-top: 0;
                                            "
                        th:with="rcpNameMail=(@{|Xin chào ${rqtMail}|})"  th:text="${rcpNameMail}"
                    >Xin chào Nguyễn Văn A,</h1>
                    <div style="background: rgba(233, 234, 247, 0.5);margin-bottom: 16px;text-align: center;padding-top: 24px;">
                      <p style="
                                                font-weight: 500;
                                                margin-top: 5px;
                                                margin-bottom: 16px;
                                                font-size: 14px;
                                                line-height: 20px;
                                                color: #121E28;
                                                    "> Vui lòng lập hợp đồng mới thay thế hợp đồng <br><br><span style="color: #2E6CF6; margin-top: 15px" th:with="nameEnv=(@{| ${envName} |})" th:text="${nameEnv}" ><b>Tên hợp đông sắp hết hạn</b></span></p>

                      <span style="
                                                font-weight: 500;
                                                margin-top: 0;
                                                margin-bottom: 16px;
                                                font-size: 14px;
                                                line-height: 20px;
                                                color: #121E28;
                                                    "> trước ngày <span style="color: #2E6CF6;" th:with="expDate=(@{| ${expDate} |})" th:text="${expDate}" ><b>Ngày hết hạn hợp đồng</b></span></span><br><br>
                      <span style="
                                                font-weight: 500;
                                                margin-top: 0;
                                                margin-bottom: 16px;
                                                font-size: 14px;
                                                line-height: 20px;
                                                color: red;
                                                    " th:text="${message}"> Nội dung lời nhắc trong phần cấu hình nhắc tái tục </span><br>
                      <br>
                      <a style="
                                                    font-size: 14px;
                                                    line-height: 24px;
                                                    padding: 8px 20px;
                                                    font-weight: bold;
                                                    text-decoration: none;
                                                    margin-bottom: 0;
                                                    display: inline-block;
                                                    background: #00B0F0;
                                                    color: #fff;
                                                    margin-bottom: 17px;
                                                "
                         th:with="url=(@{|${baseUrl}|})" th:href="${url}"
                      >ĐĂNG NHẬP</a>
                      <br>

                      <span style="
                                                font-weight: 500;
                                                margin-top: 5px;
                                                margin-bottom: 16px;
                                                font-size: 12px;
                                                line-height: 18px;
                                                color: #121E28;
                                                    "> <i> Email được gửi từ dịch vụ nhắc tái tục.  </i></span><br>

                      <span style="
                                                font-weight: 500;
                                                margin-top: 5px;
                                                margin-bottom: 16px;
                                                font-size: 12px;
                                                line-height: 18px;
                                                color: #121E28;
                                                    "> <i> Vui lòng tắt chế độ này nếu bạn đã tạo hợp đồng mới. </i></span><br><br><br>

                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- END MAIN CONTENT AREA -->
        </table>

        <!-- END CENTERED WHITE CONTAINER -->
      </div>
    </td>
    <td style="font-family: sans-serif; font-size: 12px; vertical-align: top;">&nbsp;</td>
  </tr>
</table>
</body>

</html>

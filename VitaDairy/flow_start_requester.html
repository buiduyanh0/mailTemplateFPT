<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>VITADAIRY Email</title>
</head>

<body class=""
      style="background-color: #E5E5E5;font-family: sans-serif;-webkit-font-smoothing: antialiased;font-size: 12px;line-height: 1.4;margin: 0;padding: 0;-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;">
<table border="0" cellpadding="0" cellspacing="0" class="body"
       style="border-collapse: separate;mso-table-lspace: 0pt;mso-table-rspace: 0pt;width: 100%;padding: 0;background-color: #ffffff;">
    <tbody>
    <tr style="height: 100vh">
        <td style="font-family: sans-serif; font-size: 12px; vertical-align: top;">&nbsp;</td>
        <td class="container"
            style="font-family: sans-serif;font-size: 12px;vertical-align: top;display: block;margin: 0 auto;max-width: 800px;padding: 0;width: 800px;">
            <div class="content" style="box-sizing: border-box;display: block;Margin: 0;max-width: 800px;padding: 0;">

                <!-- START CENTERED WHITE CONTAINER -->
                <div class="header"
                     style="clear: both;text-align: center;width: 100%;background: white; justify-content: center !important;">
                    <img src="https://i.imgur.com/BMuQzNg.png" alt="VITADAIRY"
                         style="max-width: 100%;height: auto;min-height: 32px;">
                </div>
                <table class="main"
                       style="border-collapse: separate; mso-table-lspace: 0pt; mso-table-rspace: 0pt; width: 100%; background: #ffffff; border-radius: 3px;">

                    <!-- START MAIN CONTENT AREA -->
                    <tr>
                        <td class="wrapper"
                            style="font-family: sans-serif; font-size: 12px; vertical-align: top; box-sizing: border-box; padding: 5%;padding-bottom: 0;">
                            <table border="0" cellpadding="0" cellspacing="0"
                                   style="border-collapse: separate; mso-table-lspace: 0pt; mso-table-rspace: 0pt; width: 100%;">
                                <tr>
                                    <td style="font-family: sans-serif; font-size: 12px; vertical-align: top;">
                                        <h1 style="
                                                font-weight: 500;
                                                font-size: 18px;
                                                line-height: 24px;
                                                color: black;
                                                margin-bottom: 24px;
                                                margin-top: 0;" > <span style="font-weight: bold">Dear:</span> Anh/Chị
                                            <span th:with="rcpNameMail=(@{|${rcpName}|})"
                                                  th:text="${rcpNameMail}" style="color: #0070C0; font-weight: bold">Nguyễn Văn A</span></h1>
                                        <div
                                                style="background: rgba(233, 234, 247, 0.5);text-align: center; padding: 20px">

                                            <p style="
                                                font-weight: 500;
                                                font-size: 15px;
                                                line-height: 18px;
                                                margin-top: 0;
                                                margin-bottom: 20px;
                                                text-align: left;">
                                                Công Ty Cổ Phần Sữa VitaDairy Việt Nam gửi thông báo:</p>
                                                <p style="color: #000;
                                                            font-size: 16px;
                                                            line-height: 24px;
                                                            text-align: left;
                                                            margin-bottom: 40px;">Tài liệu của bạn:
                                                    <b style="font-weight: 700" th:with="nameEnv=(@{| ${envName}|})"
                                                       th:text="${nameEnv}">"Hợp đồng công nghệ"</b> đã bắt đầu</p>
                                            <p style="            font-weight: 500;
                                                margin-top: 0;
                                                margin-bottom: 15px;
                                                font-size: 15px;
                                                line-height: 18px;
                                                text-align: left">Best regards!</p>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- END MAIN CONTENT AREA -->
                </table>

                <!-- END CENTERED WHITE CONTAINER -->
            </div>
        </td>
        <td style="font-family: sans-serif; font-size: 12px; vertical-align: top;">&nbsp;</td>
    </tr>
</table>
</body>

</html>
